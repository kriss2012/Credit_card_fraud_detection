<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Shield AI</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            padding: 20px;
        }

        /* Animated Background Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .shape-1 {
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: #4facfe;
        }
        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: #00f2fe;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 480px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        h2 {
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #e0e0e0;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-right: none;
            color: #fff;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none; /* Removed the left border to merge with icon */
            color: #fff;
            padding: 12px;
            font-size: 1rem;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
            color: #fff;
        }

        /* REMOVED: Custom SVG arrow background */
        /* ADDED: Appearance none to remove default system arrows */
        .form-select {
            background-image: none !important;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        /* Dropdown options need dark background */
        option {
            background-color: #2c5364;
            color: #fff;
        }

        /* REMOVED: Default browser arrows (spinners) from number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            display: none; /* Hidden initially */
        }

        .result-box.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .result-safe {
            background: rgba(46, 213, 115, 0.2);
            border: 1px solid #2ed573;
            color: #2ed573;
        }

        .result-fraud {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
        }

        /* Loading Spinner */
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Background Ambient Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="glass-card">
        <div class="text-center">
            <i class="fas fa-shield-alt fa-3x mb-3" style="color: #4facfe;"></i>
            <h2>Fraud Shield AI</h2>
            <p class="text-white-50 mb-4">Secure Transaction Analysis</p>
        </div>

        <!-- Note: action="/predict" removed for demo purposes. Re-add in production. -->
        <form id="predictionForm" onsubmit="handlePrediction(event)"> 
            
            <!-- Amount Input -->
            <div class="mb-4">
                <label class="form-label">Transaction Amount</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" step="0.01" class="form-control" name="amt" id="amt" placeholder="0.00" required>
                </div>
            </div>

            <!-- Gender Input -->
            <div class="mb-4">
                <label class="form-label">Customer Gender</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-venus-mars"></i></span>
                    <select class="form-select" name="gender" id="gender">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
            </div>

            <!-- Category Input -->
            <div class="mb-4">
                <label class="form-label">Purchase Category</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-list"></i></span>
                    <select class="form-select" name="category" id="category">
                        <!-- Simulated Jinja Loop for Demo -->
                        <option value="grocery_pos">Grocery POS</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="shopping_net">Online Shopping</option>
                        <option value="gas_transport">Gas & Transport</option>
                        <option value="misc_net">Miscellaneous</option>
                        <option value="travel">Travel</option>
                        <!-- End Simulation -->
                    </select>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="analyzeBtn">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" id="loadingSpinner"></span>
                    <span id="btnText">Analyze Transaction</span>
                </button>
            </div>
        </form>

        <!-- Result Section -->
        <div id="resultBox" class="result-box">
            <h3 id="resultTitle" class="fw-bold mb-1"></h3>
            <p id="resultProb" class="mb-0 small text-white-50"></p>
        </div>
    </div>

    <!-- JavaScript to simulate the backend prediction -->
    <script>
        function handlePrediction(event) {
            // Prevent actual form submission for this UI demo
            event.preventDefault();

            const btn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = document.getElementById('btnText');
            const resultBox = document.getElementById('resultBox');
            const amount = parseFloat(document.getElementById('amt').value);

            // UI Loading State
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Scanning...';
            resultBox.classList.remove('show');

            // Simulate API Delay (1.5 seconds)
            setTimeout(() => {
                // Mock Logic for Demo: If amount > $500, flag as High Risk
                const isFraud = amount > 500; 
                
                // Update Result Box
                if (isFraud) {
                    resultBox.className = 'result-box result-fraud show';
                    document.getElementById('resultTitle').innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>High Risk Detected';
                    document.getElementById('resultProb').textContent = 'Probability: 92.4% Fraudulent';
                } else {
                    resultBox.className = 'result-box result-safe show';
                    document.getElementById('resultTitle').innerHTML = '<i class="fas fa-check-circle me-2"></i>Transaction Safe';
                    document.getElementById('resultProb').textContent = 'Probability: 99.1% Legitimate';
                }

                // Reset Button
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Analyze Transaction';
            }, 1500);
        }
    </script>
</body>
</html>
